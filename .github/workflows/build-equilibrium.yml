name: Build Equilibrium

on:
  workflow_dispatch:

# AURA is a path dep (../AURA). Clone sibling before cargo.

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@v6
      - name: Checkout AURA (path dep ../AURA)
        run: git clone --depth 1 https://github.com/LX-Audiolabs/AURA.git ../AURA
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: linux-equilibrium-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: linux-equilibrium-
      - name: Install build dependencies
        run: |
          sudo apt-get update -y || sudo apt-get update -y || true
          sudo apt-get install -y \
            pkg-config \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libgl-dev
      - name: Build Equilibrium
        run: cargo build --release --package equilibrium
      - name: Read version
        id: version
        run: echo "version=$(grep '^version' plugins/equilibrium/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
      - name: Bundle CLAP
        run: |
          rm -rf target/bundled
          mkdir -p target/bundled
          cp target/release/libequilibrium.so target/bundled/Equilibrium.clap
          echo "✓ Created: Equilibrium.clap"
      - uses: actions/upload-artifact@v6
        with:
          name: equilibrium-v${{ steps.version.outputs.version }}-linux
          path: target/bundled/*.clap
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout AURA (path dep ../AURA)
        run: git clone --depth 1 https://github.com/LX-Audiolabs/AURA.git ../AURA
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: macos-equilibrium-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: macos-equilibrium-
      - name: Build Equilibrium
        run: cargo build --release --package equilibrium
      - name: Read version
        id: version
        run: echo "version=$(grep '^version' plugins/equilibrium/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
      - name: Bundle CLAP
        run: |
          rm -rf target/bundled
          mkdir -p target/bundled
          cp target/release/libequilibrium.dylib target/bundled/Equilibrium.clap
          echo "✓ Created: Equilibrium.clap"
      - name: Sign CLAP bundle (ad-hoc)
        run: codesign --force -s - target/bundled/Equilibrium.clap
      - uses: actions/upload-artifact@v6
        with:
          name: equilibrium-v${{ steps.version.outputs.version }}-macos
          path: target/bundled/*.clap
          if-no-files-found: error

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout AURA (path dep ../AURA)
        run: git clone --depth 1 https://github.com/LX-Audiolabs/AURA.git ../AURA
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: windows-equilibrium-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: windows-equilibrium-
      - name: Build Equilibrium
        run: cargo build --release --package equilibrium
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep '^version' plugins/equilibrium/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
      - name: Bundle CLAP
        shell: bash
        run: |
          rm -rf target/bundled
          mkdir -p target/bundled
          cp target/release/equilibrium.dll target/bundled/Equilibrium.clap
          echo "✓ Created: Equilibrium.clap"
      - uses: actions/upload-artifact@v6
        with:
          name: equilibrium-v${{ steps.version.outputs.version }}-win
          path: target/bundled/*.clap
          if-no-files-found: error
