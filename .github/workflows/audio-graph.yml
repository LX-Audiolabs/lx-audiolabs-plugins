name: audio-graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/**"
      - "crates/**"
      - "audio-graph.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audio-graph.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin workspace
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: audio-graph

      - name: Install lx-audio-graph
        # NOTE: adjust URL/branch once lx-audio-graph is published.
        # Private repo: use a PAT (CARGO_REGISTRIES / git config) or submodule.
        run: cargo install --git https://github.com/LX-Audiolabs/lx-audio-graph --branch main

      - name: Generate audio-graph
        run: lx-audio-graph .

      - name: Upload audio-graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-graph
          path: |
            audio-graph/audio-graph.json
            audio-graph/audio-graph.agent.md
            audio-graph/audio-graph.delta.md
            audio-graph/audio-graph.html
          if-no-files-found: error

      - name: Verify graph + fail on error findings
        run: |
          test -f audio-graph/audio-graph.json
          test -f audio-graph/audio-graph.agent.md
          python3 - <<'PY'
          import json, sys
          with open("audio-graph/audio-graph.json") as f:
              g = json.load(f)
          ver = g.get("version", "")
          assert ver.startswith("0.3"), f"expected version 0.3.x, got {ver}"
          assert len(g.get("nodes", [])) > 0
          ms = g.get("migration_summary") or {}
          assert ms.get("total_plugins", 0) > 0
          findings = g.get("findings") or []
          errors = [f for f in findings if f.get("severity") == "error"]
          print(
              f"audio-graph ok: v{ver}, {len(g['nodes'])} nodes, "
              f"{len(g.get('edges', []))} edges, {ms['total_plugins']} plugins, "
              f"{len(findings)} findings ({len(errors)} error)"
          )
          if errors:
              for e in errors:
                  print(f"  ERROR [{e.get('code')}] {e.get('node')}: {e.get('message')}")
              sys.exit(1)
          # Delta present after first CI commit with graph checked in
          if "delta" in g and g["delta"] is not None:
              d = g["delta"]
              print(
                  f"  delta: first_run={d.get('first_run')} "
                  f"+{len(d.get('added_nodes') or [])}/-{len(d.get('removed_nodes') or [])} nodes "
                  f"+{len(d.get('new_findings') or [])} findings"
              )
          PY
