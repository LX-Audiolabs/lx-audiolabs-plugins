[package]
name = "lx-slint-editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "truce Editor: Slint via baseview + FemtoVG OpenGL (not truce-slint wgpu)"
publish = false

[dependencies]
truce-core = { workspace = true }
truce-params = { workspace = true }
slint = { workspace = true }
baseview = { version = "0.1.4", features = ["opengl"] }
raw-window-handle = "0.5"
keyboard-types = { version = "0.6.2", default-features = false }
once_cell = "1.21"
paste = "1"
log = "0.4"
