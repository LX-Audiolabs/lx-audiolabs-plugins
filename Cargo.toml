[workspace]
members = [
    "crates/lx-ui-slint",
    "crates/lx-editor-utils",
    "crates/lx-vault",
    "crates/lx-analysis",
    # Shipping plugins only.
    "plugins/meridian",
    "plugins/aether",
    "plugins/equilibrium",
    "plugins/lucent",
    "plugins/lucent-relay",
]
resolver = "3"

[workspace.dependencies]
# AURA framework (path until crates.io publish)
aura            = { path = "../AURA/crates/aura", default-features = false }
aura-params     = { path = "../AURA/crates/aura-params" }
aura-core       = { path = "../AURA/crates/aura-core" }
aura-build      = { path = "../AURA/crates/aura-build" }
aura-editor     = { path = "../AURA/crates/aura-editor", default-features = false }
aura-baseview   = { path = "../AURA/crates/aura-baseview", default-features = false }
aura-test       = { path = "../AURA/crates/aura-test" }
# Portable DSP/analysis algorithms live in AURA; product vault/*Shared in lx_*.
aura-dsp        = { path = "../AURA/crates/aura-dsp", default-features = false }
aura-shm        = { path = "../AURA/crates/aura-shm" }
lx-vault        = { path = "crates/lx-vault" }
lx-analysis     = { path = "crates/lx-analysis" }

baseview = "0.3"
# Pin must match AURA / aura-baseview
slint           = { version = "=1.17.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
    "raw-window-handle-06",
] }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1 triggers a rustc ICE in rustfft 6.4.1 AVX code
# (lucent release build, Rust 1.96). 16 avoids it while keeping LTO.
codegen-units = 16
strip = true
# MUST be unwind: AURA host fence uses catch_unwind.
panic = "unwind"

[profile.dbg]
inherits = "release"
strip = false
debug = "full"
