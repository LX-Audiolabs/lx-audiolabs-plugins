[workspace]
members = [
    "crates/lx-slint-build",
    "crates/lx-slint-editor",
    "crates/lx-analysis",
    "crates/lx-dsp",
    "crates/lx-ui-slint",
    "crates/lx-vault",
    "crates/lx-shm",
    # AURA cutover: meridian + aether + equilibrium smoke green; lucent* WIP.
    "plugins/meridian",
    "plugins/aether",
    "plugins/equilibrium",
    "plugins/lucent",
    "plugins/lucent-relay",
]
resolver = "3"

[workspace.dependencies]
# AURA framework (path until crates.io publish)
aura            = { path = "../AURA/crates/aura", default-features = false }
aura-params     = { path = "../AURA/crates/aura-params" }
aura-core       = { path = "../AURA/crates/aura-core" }
aura-build      = { path = "../AURA/crates/aura-build" }
aura-editor     = { path = "../AURA/crates/aura-editor", default-features = false }
aura-baseview   = { path = "../AURA/crates/aura-baseview", default-features = false }
aura-test       = { path = "../AURA/crates/aura-test" }

lx-slint-build  = { path = "crates/lx-slint-build" }
lx-slint-editor = { path = "crates/lx-slint-editor" }

baseview = "0.3"
# Pin must match AURA / aura-baseview
slint           = { version = "=1.17.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
    "raw-window-handle-06",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# MUST be unwind: AURA host fence uses catch_unwind.
panic = "unwind"

[profile.dbg]
inherits = "release"
strip = false
debug = "full"
