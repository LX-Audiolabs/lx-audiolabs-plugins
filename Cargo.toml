[workspace]
members = [
    "crates/lx-ui-slint",
    "crates/lx-editor-utils",
    "crates/lx-vault",
    "crates/lx-analysis",
    "crates/lx-shm",
    # Shipping plugins only.
    "plugins/meridian",
    "plugins/aether",
    "plugins/equilibrium",
    "plugins/lucent",
    "plugins/lucent-relay",
]
resolver = "3"

[workspace.dependencies]
# AURA framework from crates.io. The published crate names use the `lx-*`
# namespace; lib names (aura::, aura_dsp::, …) are unchanged.
# default-features=false keeps format features opt-in; dsp is always on for products.
lx-aura          = { version = "0.12.0", default-features = false, features = ["dsp"] }
lx-aura-params   = { version = "0.12.0" }
lx-aura-core     = { version = "0.12.0" }
lx-aura-build    = { version = "0.12.0" }
lx-aura-editor   = { version = "0.12.0", default-features = false }
lx-aura-baseview = { version = "0.12.0", default-features = false }
# Dev-only test helpers (lib name aura_test).
lx-aura-test     = { version = "0.12.0" }
# Portable DSP/analysis algorithms live in AURA; product vault/*Shared in lx_*.
lx-aura-dsp      = { version = "0.12.0", default-features = false }
lx-shm           = { path = "crates/lx-shm" }
lx-vault         = { path = "crates/lx-vault" }
lx-analysis      = { path = "crates/lx-analysis" }

baseview = "0.3"
# Pin must match AURA / aura-baseview
slint           = { version = "=1.17.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
    "raw-window-handle-06",
] }

[profile.release]
opt-level = 3
# Thin LTO — same ship profile as the Vizia plugins (fat LTO is too slow on MSVC).
lto = "thin"
# codegen-units = 1 ICEs rustfft 6.4.1 AVX (lucent, rustc 1.96).
codegen-units = 16
strip = true
# MUST be unwind: AURA host fence uses catch_unwind.
panic = "unwind"

[profile.dbg]
inherits = "release"
strip = false
debug = "full"
