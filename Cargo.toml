[workspace]
members = [
    "crates/lx-slint-build",
    "crates/lx-slint-editor",
    "crates/lx-analysis",
    "crates/lx-dsp",
    "crates/lx-ui-slint",
    "crates/lx-vault",
    "crates/lx-shm",
    "plugins/aether-slint",
    "plugins/meridian-slint",
    "plugins/lucent-relay-slint",
    "plugins/lucent-slint",
    "plugins/aurum-slint",
    "plugins/equilibrium-slint",
]
resolver = "3"

[workspace.dependencies]
truce           = { path = "../truce-dev/crates/truce", default-features = false }
truce-core      = { path = "../truce-dev/crates/truce-core" }
truce-params    = { path = "../truce-dev/crates/truce-params" }
truce-clap      = { path = "../truce-dev/crates/truce-clap" }
truce-vst3      = { path = "../truce-dev/crates/truce-vst3" }
truce-lv2       = { path = "../truce-dev/crates/truce-lv2" }
truce-loader    = { path = "../truce-dev/crates/truce-loader" }
truce-test      = { path = "../truce-dev/crates/truce-test" }
truce-slint     = { path = "../truce-dev/crates/truce-slint" }
truce-slint-build = { path = "../truce-dev/crates/truce-slint/build" }
# keep for @truce widget materialize at Slint 1.17.1 (match truce-slint)
lx-slint-build  = { path = "crates/lx-slint-build" }
lx-slint-editor = { path = "crates/lx-slint-editor" }
# Our private fork: baseview 0.3, slint 1.17.1, 3 backends
# path: local until reopen-safe platform handoff is pushed (d78c916+)
slint-baseview  = { path = "../slint-baseview", default-features = false }
baseview = { git = "https://github.com/RustAudio/baseview.git", branch = "next" }
clap-sys        = "0.5"
# MUST match truce-slint pin
slint           = { version = "=1.17.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# MUST be unwind: truce fence host crashes with catch_unwind.
panic = "unwind"

[profile.dbg]
inherits = "release"
strip = false
debug = "full"
