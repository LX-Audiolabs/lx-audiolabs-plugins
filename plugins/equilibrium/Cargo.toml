[package]
name = "equilibrium"
version = "1.8.1"
edition = "2024"
description = "LX Audiolabs — Equilibrium"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap"]
clap = ["aura/clap"]
vst3 = ["aura/vst3"]
lv2 = ["aura/lv2"]

[dependencies]
aura = { workspace = true }
aura-editor = { workspace = true, features = ["backend-femtovg"] }
aura-dsp = { workspace = true }
lx-vault = { workspace = true }
lx-analysis = { workspace = true }
slint = { workspace = true }

lx-editor-utils = { path = "../../crates/lx-editor-utils" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"

[build-dependencies]
aura-build = { workspace = true }

[dev-dependencies]
aura-test = { workspace = true }
