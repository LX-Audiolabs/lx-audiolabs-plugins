[package]
name = "lucent"
version = "1.2.2"
edition = "2024"
description = "LX Audiolabs — Lucent (FFT spectrum analyser / masking)"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap"]
clap = ["lx-aura/clap"]
vst3 = ["lx-aura/vst3"]
lv2  = ["lx-aura/lv2"]

[dependencies]
lx-aura = { workspace = true }
lx-aura-editor = { workspace = true, features = ["backend-femtovg"] }
lx-aura-dsp = { workspace = true }
lx-vault = { workspace = true }
lx-analysis = { workspace = true }
lx-shm = { workspace = true }
lx-editor-utils = { path = "../../crates/lx-editor-utils" }
slint        = { workspace = true }

realfft     = "3"
tracing     = "0.1"

[build-dependencies]
lx-aura-build = { workspace = true }

[dev-dependencies]
lx-aura-test = { workspace = true }
