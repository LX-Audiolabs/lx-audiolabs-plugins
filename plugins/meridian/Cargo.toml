[package]
name = "meridian"
version = "1.11.1"
edition = "2024"
description = "LX Audiolabs — Meridian"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap"]
clap = ["aura/clap"]
vst3 = ["aura/vst3"]
lv2 = ["aura/lv2"]

[dependencies]
aura = { workspace = true }
aura-editor = { workspace = true, features = ["backend-femtovg"] }
slint = { workspace = true }

aura-dsp = { workspace = true }

lx-slint-editor = { path = "../../crates/lx-slint-editor" }
lx-analysis = { path = "../../crates/lx-analysis" }
realfft = "3"
tracing = "0.1"

[build-dependencies]
aura-build = { workspace = true }

[dev-dependencies]
aura-test = { workspace = true }
