[package]
name = "lucent-relay"
version = "1.1.3"
edition = "2024"
description = "LX Audiolabs — Lucent Relay (FFT sender, pass-through)"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap"]
clap = ["lx-aura/clap"]
vst3 = ["lx-aura/vst3"]
lv2 = ["lx-aura/lv2"]

[dependencies]
lx-aura = { workspace = true }
lx-aura-editor = { workspace = true, features = ["backend-femtovg"] }
lx-aura-dsp = { workspace = true }
lx-analysis = { workspace = true }
lx-shm = { workspace = true }
slint = { workspace = true }

realfft     = "3"
tracing     = "0.1"

[build-dependencies]
lx-aura-build = { workspace = true }

[dev-dependencies]
lx-aura-test = { workspace = true }
