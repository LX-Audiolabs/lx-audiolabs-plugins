[package]
name = "lucent-relay"
version = "1.1.2"
edition = "2024"
description = "LX Audiolabs — Lucent Relay (FFT sender, pass-through)"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap"]
clap = ["aura/clap"]
vst3 = ["aura/vst3"]
lv2 = ["aura/lv2"]

[dependencies]
aura = { workspace = true }
aura-editor = { workspace = true, features = ["backend-femtovg"] }
aura-dsp = { workspace = true }
aura-shm = { workspace = true }
slint = { workspace = true }

realfft     = "3"
tracing     = "0.1"

[build-dependencies]
aura-build = { workspace = true }

[dev-dependencies]
aura-test = { workspace = true }
