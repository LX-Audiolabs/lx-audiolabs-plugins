[package]
name = "aether"
version = "1.4.1"
edition = "2024"
description = "LX Audiolabs — Aether"
license = "GPL-3.0-or-later"
authors = ["LX Audiolabs"]
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap"]
clap = ["aura/clap"]
vst3 = ["aura/vst3"]
lv2 = ["aura/lv2"]

[dependencies]
aura = { workspace = true }
aura-editor = { workspace = true, features = ["backend-femtovg"] }
slint = { workspace = true }

lx-slint-editor = { path = "../../crates/lx-slint-editor" }
lx-dsp      = { path = "../../crates/lx-dsp" }
lx-analysis = { path = "../../crates/lx-analysis" }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tracing         = "0.1"

[build-dependencies]
lx-slint-build = { workspace = true }

[dev-dependencies]
aura-test = { workspace = true }
