# LX Audiolabs — Slint workspace configuration for rust-audio-graph.
# Optional: without this file the tool still applies default migration
# truce-slint → lx-slint-editor and auto-detects UI/IPC.

ui_crates = ["lx-ui-slint"]
ipc_hubs = ["lx-shm", "lx-analysis"]

[migrations.truce-slint]
from = "truce-slint"
to = "lx-slint-editor"

[rules]
plugin_target_editor = "Plugins should use lx-slint-editor, not truce-slint."
crate_vs_plugin = "Reusable logic belongs in crates/, product logic belongs in plugins/."
