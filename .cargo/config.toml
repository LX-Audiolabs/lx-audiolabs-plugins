# Cross-compilation from Windows → Linux.
#
# musl: rust-lld is enough for staticlib/rlib (cdylib is unsupported on
# MSVC-host rustc for this target).
#
# gnu (glibc .so / .clap): need a real libc sysroot. Zig provides that via
# Cross-compilation from Windows → Linux.
#
# musl: rust-lld is enough for staticlib/rlib (cdylib is unsupported on
# MSVC-host rustc for this target).
#
# gnu (glibc .so / .clap): need a real libc sysroot. Zig provides that via
# cargo-zigbuild's `zig cc` filter. Plain `cargo` / `cargo aura` pick these
# linkers up — no need to prefix every build with `cargo zigbuild`.
#
# Requires: `zig` + `cargo-zigbuild` on PATH
#   winget install zig.zig --source winget
#   cargo install cargo-zigbuild
#
# Fontconfig (Linux cross from Windows):
# 1) aura-editor enables fontique/fontconfig-dlopen for target_os=linux
#    so fontique uses dlopen bindings (not linked Fc* symbols).
# 2) RUST_FONTCONFIG_DLOPEN makes yeslogic-fontconfig-sys skip pkg-config
#    even if the feature flag is not unified for some reason.
# Runtime: libfontconfig.so.1 is loaded on the Linux DAW host.

[env]
RUST_FONTCONFIG_DLOPEN = "on"

# ── Rustc miscompilation workaround ────────────────────────────────────────
# rustc 1.96.0/1.97.1 miscompile build scripts at opt-level 0 (the default),
# producing random STATUS_ACCESS_VIOLATION / STATUS_ILLEGAL_INSTRUCTION /
# STATUS_PRIVILEGED_INSTRUCTION crashes. Full clean + toolchain reinstall fixes
# it temporarily but the crash resurfaces after dep rebuilds.
# opt-level=2 sidesteps the codegen bug. Revisit on rustc 1.98+.
# Cf. rust-toolchain.toml, AURA/rust-toolchain.toml.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-gnu]
linker = ".cargo/zigcc-x86_64-unknown-linux-gnu.bat"

[target.aarch64-unknown-linux-gnu]
linker = ".cargo/zigcc-aarch64-unknown-linux-gnu.bat"

# ── sccache ───────────────────────────────────────────────────────────────
# Shared compiler cache. Cuts cold/warm rebuilds ~40–60%.
# `sccache --show-stats` for hit/miss rates.
[build]
# rustc-wrapper = "sccache"  # disabled: not installed
