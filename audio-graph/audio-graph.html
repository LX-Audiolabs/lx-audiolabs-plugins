<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LX Audio Graph</title>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <style>
    :root {
      --bg: #141414;
      --panel: #171717;
      --panel-2: #191919;
      --text: #ffae00;
      --text-dim: #b87a00;
      --accent: #ffb000;
      --border: #191919;
      --muted: #b87a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #top {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    #sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #cy {
      flex: 1;
      background: var(--bg);
      position: relative;
      min-width: 0;
    }
    #footer {
      display: none;
      height: 46vh;
      max-height: 55vh;
      min-height: 240px;
      background: var(--panel);
      border-top: 1px solid var(--accent);
      overflow: hidden;
      min-width: 0;
      width: 100%;
    }
    #footer.open { display: flex; flex-direction: column; min-height: 0; }
    #footer-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      min-width: 0;
    }
    #footer-header .name { font-size: 16px; font-weight: 700; color: var(--accent); }
    #footer-header .close-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 3px 8px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    #footer-header .close-btn:hover { border-color: var(--accent); color: var(--accent); }
    /* Tab bar */
    #footer-tabs {
      display: flex;
      flex-shrink: 0;
      gap: 0;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      overflow-x: auto;
      min-width: 0;
    }
    #footer-tabs button {
      appearance: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    #footer-tabs button:hover { color: var(--text); }
    #footer-tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    #footer-tabs button .tab-count {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 700;
      opacity: 0.7;
      background: #2a1f00;
      padding: 1px 6px;
      border-radius: 8px;
    }
    #footer-tabs button.active .tab-count { background: #3a2a00; }
    #footer-tabs button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    /* Single scroll body for active tab */
    #footer-body {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .footer-tab-panel {
      display: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 18px 18px;
      -webkit-overflow-scrolling: touch;
    }
    .footer-tab-panel.active { display: block; }
    .footer-section-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin: 12px 0 8px 0;
      font-weight: 600;
    }
    .footer-section-title:first-child { margin-top: 0; }
    .info-row {
      font-size: 12px;
      margin-bottom: 4px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .info-row .key {
      color: var(--text-dim);
      display: inline-block;
      min-width: 90px;
      vertical-align: top;
    }
    .info-row .badge { margin: 2px 3px 2px 0; }
    .comp-wrap { display: flex; flex-wrap: wrap; gap: 2px; }
    .focus-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .focus-cards .focus-card {
      min-width: 220px;
      max-width: 320px;
      flex: 1 1 240px;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 .brand { color: #ff731a; }
    h1 .brand-sub { color: #ffffff; }
    h2 {
      margin: 16px 0 8px 0;
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 0.10em;
      font-weight: 600;
    }
    .subtitle { color: var(--text-dim); font-size: 11px; margin-bottom: 24px; opacity: 0.7; }
    .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .stat .value { color: var(--accent); font-weight: 700; }
    .filter-group { margin-bottom: 14px; }
    .filter-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.08em; }
    select, input {
      width: 100%;
      padding: 9px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 8px 10px;
      margin-top: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: #2a1f00; border-color: #b87a00; }
    #cy {
      flex: 1;
      background: var(--bg);
      position: relative;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 7px;
    }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      margin-right: 4px;
      letter-spacing: 0.05em;
    }
    .badge-legacy { background: #3a1010; color: #ff6b6b; }
    .badge-migrated { background: #103a1c; color: #6bff8d; }
    .badge-framework { background: #1a2342; color: #93c5fd; }
    .badge-plugin { background: #3a220f; color: #fb923c; }
    .badge-crate { background: #1a1a2e; color: #94a3b8; }
    .badge-error { background: #3a1010; color: #ff6b6b; }
    .badge-warn { background: #3a2a10; color: #fbbf24; }
    .badge-info { background: #1a1a2e; color: #94a3b8; }
    .finding-item { font-size: 11px; margin-bottom: 6px; line-height: 1.35; }
    .file-list { max-height: none; overflow: visible; margin-top: 4px; }
    .file-item { word-break: break-all; }
    .file-group { margin-bottom: 6px; }
    .file-group-title { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .file-item { font-size: 11px; color: var(--text); font-family: monospace; opacity: 0.9; }
    .file-ext { display: inline-block; min-width: 26px; font-size: 8px; padding: 1px 3px; border-radius: 2px;
      text-transform: uppercase; text-align: center; margin-right: 4px; font-weight: 600; letter-spacing: 0.03em; }
    .ext-rs { background: #1a2342; color: #93c5fd; }
    .ext-slint { background: #2a1f00; color: #fbbf24; }
    .ext-toml { background: #1a1a2e; color: #94a3b8; }
    .ext-other { background: #1a1a2e; color: #6b7280; }
    .dim { opacity: 0.5; }
    .focus-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      font-size: 12px;
    }
    .focus-card .fc-header { font-weight: 600; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .comp-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      background: #2a1f00;
      color: #fbbf24;
      margin: 2px 3px 2px 0;
      font-weight: 500;
      word-break: break-word;
    }
    .comp-tag.missing { background: #2a1010; color: #ff6b6b; text-decoration: line-through; }
    /* Custom scrollbars — thin, visible */
    .footer-tab-panel::-webkit-scrollbar,
    #footer-tabs::-webkit-scrollbar,
    #sidebar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .footer-tab-panel::-webkit-scrollbar-thumb,
    #footer-tabs::-webkit-scrollbar-thumb,
    #sidebar::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }
    .footer-tab-panel::-webkit-scrollbar-thumb:hover,
    #sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div id="top">
    <div id="sidebar">
      <h1><span class="brand">LX</span> <span class="brand-sub">Audio Graph</span></h1>

      <h2>Migration</h2>
      <div id="stats"></div>

      <h2>Actions</h2>
      <button class="btn" id="reset-btn">Reset graph view</button>

      <h2>Filters</h2>
      <div class="filter-group">
        <label>Kind <span class="dim" style="text-transform:none;letter-spacing:0">(strict)</span></label>
        <select id="kind-filter">
          <option value="all">all</option>
          <option value="plugin">plugins only</option>
          <option value="crate">crates only</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Framework</label>
        <select id="framework-filter"><option value="all">all</option></select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input id="search" type="text" placeholder="node name...">
      </div>

      <h2>Findings</h2>
      <div id="findings-list" style="max-height:180px;overflow-y:auto;font-size:11px"></div>

      <h2>Legend</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div id="cy"></div>
  </div>
  <div id="footer">
    <div id="footer-header"></div>
    <div id="footer-tabs" role="tablist">
      <button type="button" role="tab" data-tab="info" data-base-label="Info" class="active">Info</button>
      <button type="button" role="tab" data-tab="files" data-base-label="Files">Files</button>
      <button type="button" role="tab" data-tab="comps" data-base-label="Components">Components</button>
      <button type="button" role="tab" data-tab="deps" data-base-label="Deps">Deps</button>
      <button type="button" role="tab" data-tab="params" data-base-label="Params">Params</button>
      <button type="button" role="tab" data-tab="focus" data-base-label="Focus" disabled>Focus</button>
    </div>
    <div id="footer-body">
      <div id="tab-info" class="footer-tab-panel active" role="tabpanel"></div>
      <div id="tab-files" class="footer-tab-panel" role="tabpanel"></div>
      <div id="tab-comps" class="footer-tab-panel" role="tabpanel"></div>
      <div id="tab-deps" class="footer-tab-panel" role="tabpanel"></div>
      <div id="tab-params" class="footer-tab-panel" role="tabpanel"></div>
      <div id="tab-focus" class="footer-tab-panel" role="tabpanel"></div>
    </div>
  </div>

        if (filename.endsWith('.toml')) return '<span class="file-ext ext-toml">toml</span>';
        const dot = filename.lastIndexOf('.');
        if (dot > 0 && filename.length - dot <= 6) {
          return '<span class="file-ext ext-other">' + filename.slice(dot + 1) + '</span>';
        }
        return '';
      }

        return groups;

          }},
          { selector: 'edge', style: {
            'width': 1.5,
            'line-color': '#3a3a3a',
            'target-arrow-color': '#3a3a3a',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'arrow-scale': 0.8
          }},
          { selector: 'edge[kind = "build_depends_on"]', style: { 'line-style': 'dashed', 'line-color': '#4a4a4a' } },
          { selector: 'edge[kind = "dev_depends_on"]', style: { 'line-style': 'dotted', 'line-color': '#4a4a4a' } },
          { selector: 'edge[kind = "uses_ui"]', style: { 'line-color': '#fbbf24', 'line-style': 'dashed', 'target-arrow-color': '#fbbf24' } },
          { selector: 'edge[kind = "ipc_peer"]', style: { 'line-color': '#a78bfa', 'width': 2.5, 'target-arrow-color': '#a78bfa' } },
          { selector: 'edge[kind = "runtime_depends_on"]', style: { 'line-color': '#22d3ee', 'line-style': 'dotted', 'target-arrow-color': '#22d3ee' } }
        ],
        layout: { name: 'cose', animate: false, fit: true, padding: 80, randomize: false, componentSpacing: 60, nodeRepulsion: 400000, idealEdgeLength: 70, edgeElasticity: 100, gravity: 80, numIter: 1000 }
      });
      window._cy = cy;

      cy.ready(() => {
        cy.fit(cy.nodes(), 80);
      });

      cy.on('tap', 'node', function(evt){
        showDetail(evt.target.data());
      });

      cy.on('tap', function(evt){
        if (evt.target === cy) {
          closeFooter();
        }
      });

      function renderFindings() {
        const el = document.getElementById('findings-list');
        if (!el) return;
        if (!findings || !findings.length) {
          el.innerHTML = '<span class="dim">none</span>';
          return;
        }
        el.innerHTML = findings.slice(0, 40).map(f => {
          const sev = (f.severity || 'info').toLowerCase();
          const short = f.node ? f.node.replace(/^plugins\//, '').replace(/^crates\//, '') : '';
          const node = short ? ` <span class="dim">${short}</span>` : '';
          return `<div class="finding-item"><span class="badge badge-${sev}">${sev}</span><b>${f.code}</b>${node}<br>${f.message}</div>`;
        }).join('');
      }

      function updateStats() {
        const total = nodes.length;
        const plugins = nodes.filter(n => n.kind === 'plugin').length;
        const crates = nodes.filter(n => n.kind === 'crate').length;
        const legacy = nodes.filter(n => n.migration_status === 'legacy').length;
        const migrated = nodes.filter(n => n.migration_status === 'migrated').length;
        document.getElementById('stats').innerHTML = `
          <div class="stat"><span>total nodes</span><span class="value">${total}</span></div>
          <div class="stat"><span>plugins</span><span class="value">${plugins}</span></div>
          <div class="stat"><span>crates</span><span class="value">${crates}</span></div>
          <div class="stat"><span>legacy</span><span class="value" style="color:#ff6b6b">${legacy}</span></div>
          <div class="stat"><span>migrated</span><span class="value" style="color:#6bff8d">${migrated}</span></div>
          <div class="stat"><span>edges</span><span class="value">${edges.length}</span></div>
          <div class="stat"><span>findings</span><span class="value">${findings.length}</span></div>
        `;
      }
      updateStats();
      renderFindings();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGraph);
    } else {
      initGraph();
    }
  </script>
</body>
</html>
